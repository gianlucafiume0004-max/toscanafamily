name: Import OSM ToscanaFamily

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Scrivere su Supabase dopo aver verificato il dry-run"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: import-osm-parks
  cancel-in-progress: false

jobs:
  importa-osm:
    name: Importa dati OpenStreetMap
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Importa dati OSM
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REVERSE_GEOCODE_URL: ${{ vars.PARK_REVERSE_GEOCODE_URL }}
          WRITE_REQUESTED: ${{ inputs.write }}
        run: |
          if [ "$WRITE_REQUESTED" = "true" ]; then
            node scripts/import-osm.mjs --write
          else
            node scripts/import-osm.mjs
          fi

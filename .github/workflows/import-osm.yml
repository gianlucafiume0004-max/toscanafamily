name: Import OSM ToscanaFamily

on:
  workflow_dispatch:

jobs:
  importa-osm:
    name: Importa dati OpenStreetMap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Importa dati OSM con tentativi automatici
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          for attempt in 1 2 3 4 5
          do
            echo "Tentativo $attempt di 5..."

            if node scripts/import-osm.mjs
            then
              echo "Importazione completata correttamente."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]
            then
              echo "Tentativo fallito. Nuovo tentativo tra 30 secondi..."
              sleep 30
            fi
          done

          echo "Importazione fallita dopo 5 tentativi."
          exit 1

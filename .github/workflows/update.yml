cat > .github/workflows/update.yml <<'EOF'
name: Aggiornamento automatico parchi ed eventi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Aggiorna coordinate mancanti
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NOMINATIM_CONTACT: ${{ secrets.NOMINATIM_CONTACT }}
        run: node geocode-parks.mjs --write

      - name: Aggiorna eventi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EVENT_REQUEST_TIMEOUT_MS: 60000
        run: node scripts/update-events.mjs --write
EOF

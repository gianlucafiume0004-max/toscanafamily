name: Test Social Events

on:
  workflow_dispatch:

jobs:
  test-social-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: node --check scripts/social-events.mjs
      - run: node scripts/social-events.mjs

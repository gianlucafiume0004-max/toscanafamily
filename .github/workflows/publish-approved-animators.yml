name: Publish Approved Animators (dry run)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Simulate publication
        run: node scripts/publish-approved-animators.mjs --dry-run
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_READ_ONLY_KEY: ${{ secrets.STAGING_SUPABASE_READ_ONLY_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_READ_ONLY_KEY: ${{ secrets.PRODUCTION_SUPABASE_READ_ONLY_KEY }}

      - name: Upload dry-run report
        uses: actions/upload-artifact@v4
        with:
          name: publish-approved-animators-report
          path: publish-approved-animators-report.md
          if-no-files-found: error

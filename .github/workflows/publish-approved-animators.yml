name: Publish Approved Animators

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-approved-animators
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish approved candidates
        run: node scripts/publish-approved-animators.mjs --write
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}

      - name: Upload publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-approved-animators-report
          path: publish-approved-animators-report.md
          if-no-files-found: ignore

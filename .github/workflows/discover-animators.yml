name: Discover animator candidates

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: discover-animators
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore learning history
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "discover-animators.yml",
              status: "success",
              per_page: 100
            });
            for (const run of runs) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100
              });
              const artifact = artifacts.find(item => item.name === "animator-learning" && !item.expired);
              if (!artifact) continue;
              const archive = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner, repo: context.repo.repo,
                artifact_id: artifact.id, archive_format: "zip"
              });
              fs.writeFileSync("animator-learning.zip", Buffer.from(archive.data));
              core.info(`Storico ripristinato dal run ${run.id}`);
              return;
            }
            core.warning("Nessuno storico disponibile: apprendimento iniziale dagli approved correnti.");

      - name: Extract learning history
        run: if [ -f animator-learning.zip ]; then unzip -o animator-learning.zip animator-learning.json; fi

      - name: Discover candidates
        run: node scripts/discover-animators.mjs
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          ANIMATOR_AUTO_APPROVE: "true"

      - name: Upload learning history
        uses: actions/upload-artifact@v4
        with:
          name: animator-learning
          path: animator-learning.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animator-discovery-report
          path: animators-report.md
          if-no-files-found: ignore
